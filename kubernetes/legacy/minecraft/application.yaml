apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minecraft
  namespace: argocd
spec:
  project: default

  source:
    repoURL: git@github.com:FelipeMalacarne/zamorak-core.git
    targetRevision: main
    path: kubernetes/apps/minecraft/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: minecraft

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
