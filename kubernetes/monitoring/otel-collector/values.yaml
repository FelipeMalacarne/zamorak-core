mode: daemonset

image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.95.0

command:
  name: otelcol-contrib

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 300m
    memory: 512Mi

podSecurityContext:
  runAsUser: 0
  runAsGroup: 0
  fsGroup: 0

extraVolumes:
  - name: varlogpods
    hostPath:
      path: /var/log/pods
  - name: varlibdocker
    hostPath:
      path: /var/lib/docker/containers
      type: DirectoryOrCreate
  - name: varlibcontainerd
    hostPath:
      path: /var/lib/containerd/io.containerd.runtime.v2.task/k8s.io
      type: DirectoryOrCreate
  - name: varlibotelcol
    hostPath:
      path: /var/lib/otelcol
      type: DirectoryOrCreate

extraVolumeMounts:
  - name: varlogpods
    mountPath: /var/log/pods
    readOnly: true
  - name: varlibdocker
    mountPath: /var/lib/docker/containers
    readOnly: true
  - name: varlibcontainerd
    mountPath: /var/lib/containerd/io.containerd.runtime.v2.task/k8s.io
    readOnly: true
  - name: varlibotelcol
    mountPath: /var/lib/otelcol

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    hostPort: null
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    hostPort: null
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["pods", "namespaces", "nodes"]
      verbs: ["get", "list", "watch"]

config:
  receivers:
    jaeger: null
    prometheus: null
    zipkin: null
    otlp:
      protocols:
        grpc: {}
        http: {}

    filelog:
      include:
        - /var/log/pods/*/*/*.log
      exclude:
        - /var/log/pods/*/otel-collector/*.log
      start_at: end
      storage: file_storage
      operators:
        # CRI log parser compatible with 0.82.0
        - type: regex_parser
          regex: '^(?P<time>[^ ]+) (?P<stream>stdout|stderr) (?P<log>.*)$'
          timestamp:
            parse_from: attributes.time
            layout_type: gotime
            layout: '2006-01-02T15:04:05.999999999Z07:00'

  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133
    file_storage:
      directory: /var/lib/otelcol

  processors:
    k8sattributes:
      auth_type: serviceAccount
      passthrough: false
      extract:
        metadata:
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.container.name
          - k8s.node.name
          - k8s.pod.uid

    transform:
      log_statements:
        - context: log
          statements:
            - set(resource.attributes["cluster"], "homelab")
            - set(resource.attributes["namespace"], resource.attributes["k8s.namespace.name"])
            - set(resource.attributes["pod"], resource.attributes["k8s.pod.name"])
            - set(resource.attributes["container"], resource.attributes["k8s.container.name"])

    batch: {}

  exporters:
    debug: null
    logging: null
    loki:
      endpoint: http://loki.monitoring:3100/loki/api/v1/push
      tls:
        insecure: true

  service:
    pipelines:
      traces: null
      metrics: null
      logs:
        receivers: [filelog, otlp]
        processors: [memory_limiter, k8sattributes, transform, batch]
        exporters: [loki]
    extensions: [health_check, file_storage]
