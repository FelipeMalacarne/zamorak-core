mode: daemonset

image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.82.0

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

config:
  receivers:
    otlp:
      protocols:
        grpc:
        http:

    filelog:
      include:
        - /var/log/pods/*/*/*.log
      exclude:
        - /var/log/pods/*/otel-collector/*.log
      start_at: beginning
      include_file_path: true
      include_file_name: false
      operators:
        - type: container
          format: auto

  processors:
    batch:

    k8sattributes:
      auth_type: serviceAccount
      passthrough: false
      extract:
        metadata:
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.container.name
          - k8s.node.name
          - k8s.pod.uid

  exporters:
    loki:
      endpoint: http://loki.monitoring:3100/otlp
      tls:
        insecure: true

  service:
    pipelines:
      logs:
        receivers: [filelog, otlp]
        processors: [k8sattributes, batch]
        exporters: [loki]

extraVolumes:
  - name: varlogpods
    hostPath:
      path: /var/log/pods
  - name: varlibdockercontainers
    hostPath:
      path: /var/lib/docker/containers

extraVolumeMounts:
  - name: varlogpods
    mountPath: /var/log/pods
    readOnly: true
  - name: varlibdockercontainers
    mountPath: /var/lib/docker/containers
    readOnly: true
