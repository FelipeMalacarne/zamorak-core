apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: core
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io  # Garante limpeza ao deletar
spec:
  project: default
  source:
    repoURL: git@github.com:FelipeMalacarne/zamorak-core.git
    targetRevision: main
    path: kubernetes/apps
    directory:
      recurse: true
      # include: "**/application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
