apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft-server
  labels:
    app.kubernetes.io/name: minecraft
    app.kubernetes.io/instance: minecraft
  namespace: minecraft
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minecraft
      app.kubernetes.io/instance: minecraft
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minecraft
        app.kubernetes.io/instance: minecraft
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: server
          image: itzg/minecraft-server
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: minecraft-server-config
          env:
            - name: CF_API_KEY
              valueFrom:
                secretKeyRef:
                  name: minecraft-curseforge
                  key: CF_API_KEY
                  optional: true
          ports:
            - name: game
              containerPort: 25565
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: "500m"
              memory: "4Gi"
            limits:
              cpu: "2"
              memory: "8Gi"
          volumeMounts:
            - name: data
              mountPath: /data

        - name: mc-monitor
          image: itzg/mc-monitor
          imagePullPolicy: IfNotPresent
          args:
            - export-for-prometheus
          env:
            - name: EXPORT_SERVERS
              value: "localhost:25565"
            - name: DEBUG
              value: "true"
          ports:
            - name: metrics
              containerPort: 9150
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minecraft-data
