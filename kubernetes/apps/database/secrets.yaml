---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postgres-creds
  namespace: database
spec:
  encryptedData:
    postgres-password: 
  template:
    metadata:
      name: postgres-creds
      namespace: database
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: rabbitmq-creds
  namespace: database
spec:
  encryptedData:
    rabbitmq-erlang-cookie: 
    rabbitmq-password: 
  template:
    metadata:
      name: rabbitmq-creds
      namespace: database
    type: Opaque
